name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - run: echo "$KEYSTORE_B64" | base64 -d > app/release.p12
        env: { KEYSTORE_B64: "${{ secrets.KEYSTORE_B64 }}" }
      - run: gradle assembleRelease --no-daemon
        env: { KS_PASS: "${{ secrets.KS_PASS }}" }
      - run: cp app/build/outputs/apk/release/app-release.apk CallAgent.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 통화분석 APK v1.${{ github.run_number }}
          files: CallAgent.apk
